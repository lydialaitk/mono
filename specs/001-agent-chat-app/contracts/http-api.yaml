openapi: 3.1.0
info:
  title: Agent Chat App HTTP API
  version: 1.0.0
  summary: Versioned chat and status API for the Traditional Chinese agent chat app
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Process health endpoint
      operationId: getHealth
      responses:
        "200":
          description: Backend process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /status:
    get:
      summary: Typed service status endpoint
      operationId: getStatus
      responses:
        "200":
          description: Backend status details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/v1/chat:
    post:
      summary: Stream assistant replies for a chat request
      operationId: streamChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream of assistant response events
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events carrying JSON payloads shaped like StreamEvent
        "400":
          description: Invalid request before stream start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Backend failure before stream start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        time:
          type: string
          format: date-time
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - service
        - status
        - time
        - replyMode
        - streamTransport
      properties:
        schemaVersion:
          type: string
          enum: [v1]
        service:
          type: string
        status:
          type: string
          enum: [ok, degraded]
        time:
          type: string
          format: date-time
        replyMode:
          type: string
          enum: [mock, real-llm]
        streamTransport:
          type: string
          enum: [sse]
        configurationState:
          type: object
          additionalProperties:
            type: string
    ChatRequest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - stream
        - messages
      properties:
        schemaVersion:
          type: string
          enum: [v1]
        requestId:
          type: string
        stream:
          type: boolean
          const: true
        client:
          type: object
          additionalProperties: false
          properties:
            app:
              type: string
            appVersion:
              type: string
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
    StreamEvent:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - type
        - requestId
        - sequence
        - timestamp
        - data
      properties:
        schemaVersion:
          type: string
          enum: [v1]
        type:
          type: string
          enum:
            - response.start
            - response.delta
            - response.complete
            - response.error
        requestId:
          type: string
        sequence:
          type: integer
          minimum: 1
        timestamp:
          type: string
          format: date-time
        data:
          oneOf:
            - $ref: "#/components/schemas/ResponseStartData"
            - $ref: "#/components/schemas/ResponseDeltaData"
            - $ref: "#/components/schemas/ResponseCompleteData"
            - $ref: "#/components/schemas/ResponseErrorData"
    ResponseStartData:
      type: object
      additionalProperties: false
      required:
        - messageId
      properties:
        messageId:
          type: string
        replyMode:
          type: string
          enum: [mock, real-llm]
    ResponseDeltaData:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
    ResponseCompleteData:
      type: object
      additionalProperties: false
      required:
        - message
        - finishReason
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"
        finishReason:
          type: string
          enum: [stop, error]
    ResponseErrorData:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - error
      properties:
        schemaVersion:
          type: string
          enum: [v1]
        requestId:
          type: string
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
